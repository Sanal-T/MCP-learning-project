[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-learning-project"
version = "0.1.0"
description = "A small local MCP server for learning tool discovery and retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
